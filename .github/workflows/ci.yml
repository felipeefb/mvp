name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test-and-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Javadoc (compilation check)
        run: ./gradlew :application:javadoc --no-daemon

      - name: Run tests with coverage (fails <90%)
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload Jacoco HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: modules/*/build/reports/jacoco/test/html

      - name: SonarQube / SonarCloud analysis
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonarqube --no-daemon -Dsonar.qualitygate.wait=true -Dsonar.projectKey=felipeefb_mvp -Dsonar.organization=felipeefb

      - name: Fail if Sonar secrets are missing
        if: ${{ (secrets.SONAR_TOKEN == '' || secrets.SONAR_HOST_URL == '') && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') }}
        run: |
          echo "Sonar secrets not configured (SONAR_TOKEN, SONAR_HOST_URL). Skipping analysis." >&2
          exit 0
