plugins {
    id 'org.springframework.boot' version '3.4.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.sonarqube' version '5.0.0.4638'
    id 'jacoco'
}

group = 'com.felipe.belo'
version = '0.0.1-SNAPSHOT'
description = 'mvp'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    group = rootProject.group
    version = rootProject.version

    java {
        sourceCompatibility = '21'
        targetCompatibility = '21'
    }

    repositories {
        mavenCentral()
    }

    jacoco {
        toolVersion = '0.8.12'
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.0"
            mavenBom "org.springframework.modulith:spring-modulith-bom:1.4.4"
        }
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy(tasks.named('jacocoTestReport'))
    }

    tasks.named('jacocoTestReport') {
        dependsOn(tasks.named('test'))
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.named('jacocoTestCoverageVerification') {
        dependsOn(tasks.named('test'))
        violationRules {
            rule {
                limit {
                    minimum = 0.90
                }
            }
        }
    }

    tasks.register('aggregateJavadoc', Javadoc) {
        description = 'Generates aggregated Javadoc for all modules'
        group = JavaBasePlugin.DOCUMENTATION_GROUP

        // collect all main sources from subprojects
        source = subprojects*.sourceSets.main*.allJava
        // union of classpaths so cross-module types resolve
        classpath = files(subprojects*.sourceSets.main*.compileClasspath)

        destinationDir = file("$layout.buildDirectory/docs/javadoc-aggregate")
        options.encoding = 'UTF-8'
        options.addBooleanOption('html5', true)
    }
}

// Aggregate coverage across subprojects
tasks.register('jacocoRootReport', JacocoReport) {
    dependsOn(subprojects.collect { it.tasks.named('test') })
    executionData.from(subprojects.collect { it.fileTree("${it.buildDir}/jacoco") { include "**/*.exec", "**/*.ec" } })
    sourceDirectories.from(files(subprojects.collect { it.sourceSets.main.allSource.srcDirs }))
    classDirectories.from(files(subprojects.collect { it.sourceSets.main.output }))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('enforceCoverage') {
    dependsOn(subprojects.collect { it.tasks.named('jacocoTestCoverageVerification') })
}

tasks.named('check') {
    dependsOn('enforceCoverage')
}

sonarqube {
    properties {
        property "sonar.projectKey", "felipeefb_mvp"
        property "sonar.organization", "felipeefb"
        property "sonar.projectName", "MVP Spring Boot"
        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java"
        property "sonar.java.binaries", "**/build/classes/java/main"
        property "sonar.junit.reportPaths", "**/build/test-results/test"
        property "sonar.coverage.jacoco.xmlReportPaths", "**/build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.gradle.skipCompile", "true"
    }
}
