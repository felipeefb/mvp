
###############################
# PROFILE / APP
###############################
spring.application.name=mvp
spring.profiles.active=dev

###############################
# DATASOURCE (PostgreSQL - DEV)
###############################
spring.datasource.url=jdbc:postgresql://localhost:5432/mvpdatabase
spring.datasource.username=mvp
spring.datasource.password=secret123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

###############################
# JPA / HIBERNATE
###############################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

###############################
# FLYWAY
###############################
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

###############################
# SPRING SESSION
###############################
spring.session.jdbc.initialize-schema=never

###############################
# I18N / MENSAGENS
###############################
# Substitui ResourceBundleMessageConfig
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=true
spring.messages.cache-duration=3600s

###############################
# LOCALE / INTERNACIONALIZA��O
###############################
# Substitui LocaleConfig
spring.web.locale=en_US
spring.web.locale-resolver=accept-header

###############################
# SECURITY / JWT
###############################
spring.security.user.name=admin
spring.security.user.password=secret123
spring.security.user.roles=ADMIN
security.jwt.secret=SusT3Nt3cS1GV1rtMyS3cr3tK3y123456789ABCDEFGHIJKLMNOP
security.jwt.access-token-expiration-minutes=1440
security.jwt.refresh-token-expiration-minutes=10080

###############################
# LOGGING DEV
###############################
logging.level.org.springframework=INFO
logging.level.com.felipe.belo=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.com.nimbusds=DEBUG

# Se quiser enxergar SQL em mais detalhes:
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

###############################
# SPRINGDOC / OPENAPI (opcional)
###############################
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Resolve docker compose from current working directory (IDE runs from repo root)
spring.docker.compose.file=${user.dir}/compose.yaml
