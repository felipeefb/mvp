
###############################
# PROFILE / APP
###############################
spring.application.name=mvp
spring.profiles.active=dev

###############################
# DATASOURCE (PostgreSQL - DEV)
###############################
spring.datasource.url=jdbc:postgresql://localhost:5432/mvpdatabase
spring.datasource.username=mvp
spring.datasource.password=secret123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

###############################
# JPA / HIBERNATE
###############################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.session.jdbc.initialize-schema=always

###############################
# I18N / MENSAGENS
###############################
# Substitui ResourceBundleMessageConfig
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=true
spring.messages.cache-duration=3600s

###############################
# LOCALE / INTERNACIONALIZAÇÃO
###############################
# Substitui LocaleConfig
spring.web.locale=en_US
spring.web.locale-resolver=accept-header

###############################
# SECURITY / JWT
###############################
spring.security.user.name=admin
spring.security.user.password=secret123
spring.security.user.roles=ADMIN
security.jwt.secret=SusT3Nt3cS1GV1rt

###############################
# LOGGING DEV
###############################
logging.level.org.springframework=INFO
logging.level.com.felipe.belo=DEBUG

# Se quiser enxergar SQL em mais detalhes:
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

###############################
# SPRINGDOC / OPENAPI (opcional)
###############################
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html