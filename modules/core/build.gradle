dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    api 'org.springframework.session:spring-session-jdbc'
    api 'org.flywaydb:flyway-core'
    api 'org.flywaydb:flyway-database-postgresql'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    api 'org.apache.commons:commons-lang3:3.18.0'
    api 'org.springframework.modulith:spring-modulith-starter-core'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

sourceSets {
    main {
        java {
            srcDirs = ["$rootDir/src/main/java"]
            include "com/felipe/belo/mvp/core/**"
        }
        resources {
            srcDirs = []
        }
    }
}
